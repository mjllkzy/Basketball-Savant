name: Basketball News Refresh

on:
  schedule:
    # 5:15 PM America/Phoenix for fan-facing news and roster freshness.
    - cron: "15 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: basketball-news-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Validate refresh scripts
        run: |
          python -m py_compile scripts/refresh_nba_news.py
          python -m py_compile scripts/sync_current_roster_transactions.py
          python -m py_compile scripts/sync_official_contract_agreements.py
          python -m py_compile scripts/validate_current_roster_transactions.py

      - name: Refresh NBA.com and trusted rumor news data
        run: python scripts/refresh_nba_news.py --require-rumors

      - name: Refresh NBA.com roster transaction data
        run: |
          python scripts/sync_current_roster_transactions.py --write
          python scripts/validate_current_roster_transactions.py

      - name: Sync official contract agreement data
        run: python scripts/sync_official_contract_agreements.py --write

      - name: Commit refreshed news and roster data when changed
        run: |
          set -euo pipefail
          if git diff --quiet -- src/lib/data/news.json src/lib/data/current-roster-transactions.json data/raw/player_contracts_2025_2031.json data/raw/player_contract_deals_2025_2031.json; then
            echo "Basketball news, roster transaction, and contract agreement data are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/data/news.json src/lib/data/current-roster-transactions.json data/raw/player_contracts_2025_2031.json data/raw/player_contract_deals_2025_2031.json
          git commit -m "Refresh basketball news, roster, and contract data"
          git push
